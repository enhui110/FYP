<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>MuTice | Authentication</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #27ae60;
            --bg: #f4f7f6;
            --info: #3498db;
            --danger: #e74c3c;
            --warning: #f39c12;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .auth-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 350px;
            text-align: center;
        }

        h2 {
            color: #2c3e50;
            margin-top: 0;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
            transition: 0.2s;
        }

        input:focus {
            border-color: #27ae60;
            outline: none;
            box-shadow: 0 0 5px rgba(39, 174, 96, 0.2);
        }

        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
            margin-bottom: 15px;
        }
        
        .password-wrapper input {
            margin-bottom: 0;
            padding-right: 45px;
        }

        /* 🌟 小眼睛图标样式 */
        .password-toggle-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.5;
            transition: 0.2s;
        }
        
        .password-toggle-icon:hover {
            opacity: 1;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 16px;
            transition: 0.2s;
        }

        .btn:hover {
            background: #219150;
        }

        .toggle-link {
            margin-top: 20px;
            display: block;
            color: #3498db;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
        }

        .toggle-link:hover {
            text-decoration: underline;
        }

        .forgot-inline {
            color: #3498db;
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
            user-select: none;
            display: block;
            text-align: right;
            margin: -5px 0 15px 0; /* 调整间距 */
        }

        .forgot-inline:hover {
            text-decoration: underline;
        }

        .back-link {
            display: block;
            margin-top: 25px;
            color: #888;
            text-decoration: none;
            font-size: 13px;
            transition: 0.2s;
        }

        .back-link:hover {
            color: #2c3e50;
            font-weight: bold;
        }

        #signup-form {
            display: none;
        }

        #reset-form {
            display: none;
        }

        /* Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 350px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>
    <div class="auth-card">
        <div id="login-form">
            <h2>Welcome Back</h2>
            <form onsubmit="handleAuth(event, 'login')">
                <input type="email" id="login-email" placeholder="Email Address" required>
                
                <div class="password-wrapper">
                    <input type="password" id="login-password" placeholder="Password" required>
                    <span class="password-toggle-icon" onclick="togglePasswordVisibility('login-password', this)">
                        <img src="pic/hide.png" width="20" height="20" alt="Hide">
                    </span>
                </div>
                
                <span class="forgot-inline" onclick="toggleForm('reset')">Forgot password?</span>
                <button type="submit" class="btn">Login</button>
            </form>
            <span class="toggle-link" onclick="toggleForm('signup')">Don't have an account? Sign Up</span>
        </div>
        
        <div id="signup-form">
            <h2>Create Account</h2>
            <form onsubmit="handleAuth(event, 'signup')">
                <input type="text" id="signup-name" placeholder="Full Name" required>
                <input type="email" id="signup-email" placeholder="Email Address" required>
                
                <div class="password-wrapper">
                    <input type="password" id="signup-password" placeholder="Create Password" required>
                    <span class="password-toggle-icon" onclick="togglePasswordVisibility('signup-password', this)">
                        <img src="pic/hide.png" width="20" height="20" alt="Hide">
                    </span>
                </div>
                
                <div class="password-wrapper">
                    <input type="password" id="signup-confirm-password" placeholder="Confirm Password" required>
                    <span class="password-toggle-icon" onclick="togglePasswordVisibility('signup-confirm-password', this)">
                        <img src="pic/hide.png" width="20" height="20" alt="Hide">
                    </span>
                </div>
                
                <button type="submit" class="btn" style="background: #3498db;">Sign Up</button>
            </form>
            <span class="toggle-link" onclick="toggleForm('login')">Already have an account? Login</span>
        </div>
        
        <div id="reset-form">
            <h2>Reset Password</h2>
            <form onsubmit="handleForgotPassword(event)">
                <input type="email" id="reset-email" placeholder="Email Address" required>
                
                <div class="password-wrapper">
                    <input type="password" id="reset-password" placeholder="New Password (min 6 chars)" minlength="6" required>
                    <span class="password-toggle-icon" onclick="togglePasswordVisibility('reset-password', this)">
                        <img src="pic/hide.png" width="20" height="20" alt="Hide">
                    </span>
                </div>
                
                <div class="password-wrapper">
                    <input type="password" id="reset-confirm-password" placeholder="Confirm New Password" minlength="6" required>
                    <span class="password-toggle-icon" onclick="togglePasswordVisibility('reset-confirm-password', this)">
                        <img src="pic/hide.png" width="20" height="20" alt="Hide">
                    </span>
                </div>
                
                <button type="submit" class="btn" style="background: #22cfe6;">Reset Password</button>
            </form>
            <span class="toggle-link" onclick="toggleForm('login')">Back to Login</span>
        </div>
        <a href="index.html" class="back-link">← Back to Dashboard</a>
    </div>

    <!-- Alert Modal -->
    <div id="alert-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 id="alert-title" style="margin-top: 0; color: var(--primary);">Notification</h3>
            <p id="alert-msg" style="font-size: 15px; color: #555; white-space: pre-wrap;"></p>
            <div style="display: flex; justify-content: center; margin-top: 20px;">
                <button type="button" class="btn" style="background: var(--info); color: white; width: 100%;" onclick="closeModal('alert-modal')">OK</button>
            </div>
        </div>
    </div>

    <script>
        const API = window.location.hostname === 'localhost' ? "http://localhost:3000/api" : "/api";
        const originalFetch = window.fetch;
        window.fetch = function(url, options) {
            if (typeof url === 'string' && url.includes('http://localhost:3000')) {
                url = url.replace('http://localhost:3000', '');
            }
            return originalFetch(url, options);
        };

        if (localStorage.getItem('mutice_logged_in') === 'true') { window.location.href = "index.html"; }

        const svgEye = '<img src="pic/eye.png" width="20" height="20" alt="Show">';
        const svgEyeOff = '<img src="pic/hide.png" width="20" height="20" alt="Hide">';

        function togglePasswordVisibility(inputId, iconEl) {
            const input = document.getElementById(inputId);
            if (input.type === "password") {
                input.type = "text";
                iconEl.innerHTML = svgEye; 
            } else {
                input.type = "password";
                iconEl.innerHTML = svgEyeOff;
            }
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        function showAlert(message, title = "Notification") {
            document.getElementById('alert-title').innerText = title;
            document.getElementById('alert-msg').innerText = message;
            document.getElementById('alert-modal').style.display = 'flex';
        }

        function toggleForm(type) {
            document.getElementById('login-form').style.display = type === 'login' ? 'block' : 'none';
            document.getElementById('signup-form').style.display = type === 'signup' ? 'block' : 'none';
            document.getElementById('reset-form').style.display = type === 'reset' ? 'block' : 'none';
            
            document.querySelectorAll('.password-wrapper input').forEach(input => input.type = 'password');
            document.querySelectorAll('.password-toggle-icon').forEach(icon => icon.innerHTML = svgEyeOff);
        }

        async function handleAuth(event, type) {
            event.preventDefault();
            const btn = event.target.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = "Processing...";
            btn.disabled = true;

            const email = document.getElementById(`${type}-email`).value.trim();
            const password = document.getElementById(`${type}-password`).value;
            const name = (type === 'signup') ? document.getElementById('signup-name').value.trim() : null;

            if (type === 'signup') {
                const confirmPassword = document.getElementById('signup-confirm-password').value;
                if (password !== confirmPassword) {
                    showAlert('Password and Confirm Password do not match.');
                    btn.innerText = originalText;
                    btn.disabled = false;
                    return;
                }
            }

            try {
                const res = await fetch(`${API}/${type}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });

                const rawText = await res.text();
                let data = {};
                try {
                    data = rawText ? JSON.parse(rawText) : {};
                } catch (parseError) {
                    data = { message: "Server connection error." };
                }

                if (res.ok && data.success) {
                    if (type === 'signup') {
                        showAlert("Account Created! You can now login.", "Success");
                        toggleForm('login');
                        event.target.reset();
                    } else {
                        localStorage.setItem('mutice_logged_in', 'true');
                        localStorage.setItem('mutice_token', data.token);
                        localStorage.setItem('mutice_user', data.userName);
                        localStorage.setItem('mutice_user_id', String(data.userId || ''));
                        window.location.replace("index.html");
                    }
                } else {
                    showAlert(data.message || "Operation failed!");
                }
            } catch (err) {
                showAlert("Server connection failed!");
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        async function handleForgotPassword(event) {
            event.preventDefault();
            const btn = event.target.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = 'Processing...';
            btn.disabled = true;

            const email = document.getElementById('reset-email').value.trim();
            const newPassword = document.getElementById('reset-password').value;
            const confirmNewPassword = document.getElementById('reset-confirm-password').value;

            if (newPassword !== confirmNewPassword) {
                showAlert('New Password and Confirm Password do not match.');
                btn.innerText = originalText;
                btn.disabled = false;
                return;
            }

            try {
                const res = await fetch(`${API}/forgot-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, newPassword })
                });

                const rawText = await res.text();
                let data = {};
                try {
                    data = rawText ? JSON.parse(rawText) : {};
                } catch {
                    data = { message: rawText || 'Server error' };
                }

                if (res.ok && data.success) {
                    showAlert(data.message || 'Password reset successful.', "Success");
                    event.target.reset();
                    toggleForm('login');
                } else {
                    showAlert(data.message || 'Reset password failed.');
                }
            } catch (err) {
                showAlert('Server connection failed!');
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }
    </script>
</body>

</html>
